services:
  - type: web
    name: chatbot-bolivia
    runtime: docker
    plan: free
    healthCheckPath: /estado
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
